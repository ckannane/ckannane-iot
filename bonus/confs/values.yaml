# Minimal-footprint GitLab values for the local k3d cluster from Part 3.
# Plain HTTP through k3d's bundled Traefik. Since chart v10.0 (GitLab 19),
# PostgreSQL, Redis and object storage are external: they come from
# gitlab-deps.yaml, deployed by setup.sh into the same namespace.
global:
  edition: ce
  hosts:
    domain: k3d.local          # GitLab is served at gitlab.k3d.local
    https: false
  # Since GitLab 19.0 the chart defaults to Gateway API + a bundled Envoy
  # Gateway. k3d already ships Traefik, so use a plain Ingress instead.
  gatewayApi:
    enabled: false
    installEnvoy: false
    configureCertmanager: false
  ingress:
    enabled: true
    class: traefik
    provider: traefik
    configureCertmanager: false
    tls:
      enabled: false
  kas:
    enabled: false

  psql:
    host: gitlab-postgres.gitlab.svc.cluster.local
    port: 5432
    database: gitlabhq_production
    username: gitlab
    password:
      secret: gitlab-postgres
      key: password

  redis:
    host: gitlab-valkey.gitlab.svc.cluster.local
    port: 6379
    auth:
      enabled: false

  minio:
    enabled: false
  appConfig:
    object_store:
      enabled: true
      # Garage is only reachable inside the cluster, so GitLab proxies
      # downloads instead of redirecting browsers to it.
      proxy_download: true
      connection:
        secret: gitlab-object-storage
        key: config

installCertmanager: false
nginx-ingress:
  enabled: false
prometheus:
  install: false
gitlab-runner:
  install: false
registry:
  enabled: false

gitlab:
  toolbox:
    backups:
      objectStorage:
        config:
          secret: gitlab-object-storage-s3cmd
          key: config
  webservice:
    minReplicas: 1
    maxReplicas: 1
    resources:
      requests:
        cpu: 300m
        memory: 1Gi
  sidekiq:
    minReplicas: 1
    maxReplicas: 1
  gitlab-shell:
    minReplicas: 1
    maxReplicas: 1
  gitaly:
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
